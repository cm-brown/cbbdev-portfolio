<header class="site-header wrap">
  <a class="brand" href="{{ "/" | relURL }}" aria-label="CBB home"><picture><source srcset="{{ "img/cbb-lockup-dark.svg" | relURL }}" media="(prefers-color-scheme: dark)"><img src="{{ "img/cbb-lockup-light.svg" | relURL }}" alt="CBB" width="270" height="110"></picture></a>
  <nav aria-label="Main">{{ range site.Menus.main }}<a href="{{ .URL }}"{{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a>{{ end }}</nav>
</header>
