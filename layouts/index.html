{{ define "main" }}
<section class="hero">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
</section>
<section>
  <h2>Selected projects</h2>
  <div class="grid">
    {{ range first 6 (where site.RegularPages "Section" "projects").ByWeight }}{{ partial "project-card.html" . }}{{ end }}
  </div>
</section>
{{ end }}
