{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  {{ with .Params.tags }}<ul class="tags">{{ range . }}<li>{{ . }}</li>{{ end }}</ul>{{ end }}
  {{ .Content }}
  {{ with .Params.repo }}<p><a href="{{ . }}">View the code on GitHub →</a></p>{{ end }}
  {{ with .Params.demo }}<p><a href="{{ . }}">Live demo →</a></p>{{ end }}
</article>
{{ end }}
