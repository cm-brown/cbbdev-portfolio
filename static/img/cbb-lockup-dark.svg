<defs>
<filter id="smoke" x="-15%" y="-30%" width="130%" height="160%">
<feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="3" seed="11" result="n"></feTurbulence>
<feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G" result="d"></feDisplacementMap>
<feGaussianBlur in="d" stdDeviation="5" result="soft"></feGaussianBlur>
<feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="4" result="grain"></feTurbulence>
<feDisplacementMap in="d" in2="grain" scale="6" xChannelSelector="R" yChannelSelector="G" result="d2"></feDisplacementMap>
<feGaussianBlur in="d2" stdDeviation="0.9" result="core"></feGaussianBlur>
<feMerge><feMergeNode in="soft"></feMergeNode><feMergeNode in="core"></feMergeNode></feMerge>
</filter>
<filter id="plume" x="-30%" y="-60%" width="160%" height="220%">
<feTurbulence type="fractalNoise" baseFrequency="0.02 0.05" numOctaves="3" seed="5" result="n"></feTurbulence>
<feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G" result="d"></feDisplacementMap>
<feGaussianBlur in="d" stdDeviation="4"></feGaussianBlur>
</filter>
